ext-anchor="start" font-family="DM Mono, monospace" font-size="9" font-weight="500" style="fill:#29252c">DASHBOARD</text><circle cx="184" cy="33" r="4" style="fill:none;stroke:#29252c" stroke-width="2"/><circle cx="170" cy="33" r="4" style="fill:none;stroke:#29252c" stroke-width="2"/><path d="M24 104H44L50 86L60 124L66 96H92" style="fill:none;stroke:#29252c" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/><path d="M102 104H128" style="fill:none;stroke:#29252c" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/><path d="M121 97L128 104L121 111" style="fill:none;stroke:#29252c" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/><path d="M150 98V88A12 12 0 0 1 174 88V98" style="fill:none;stroke:#29252c" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/><rect x="142" y="98" width="40" height="36" rx="0" style="fill:#f2b58c;stroke:#29252c" stroke-width="2"/><path d="M162 107C162.54 113.3 164.7 115.46 171 116C164.7 116.54 162.54 118.7 162 125C161.46 118.7 159.3 116.54 153 116C159.3 115.46 161.46 113.3 162 107Z" style="fill:#29252c"/><path d="M110 160V180" style="fill:none;stroke:#5f5862" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" stroke-dasharray="2 3"/><rect x="22" y="180" width="176" height="30" rx="15" style="fill:#fee2cf;stroke:#29252c" stroke-width="2"/><circle cx="44" cy="195" r="5.5" style="fill:none;stroke:#29252c" stroke-width="2"/><path d="M50 195H62M58 195V200" style="fill:none;stroke:#29252c" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/><text x="126" y="198.5" text-anchor="middle" font-family="DM Mono, monospace" font-size="8.5" font-weight="500" style="fill:#29252c">PASSKEY / RECOVERY KEY</text><text x="110.0" y="250" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="13" font-weight="500" letter-spacing="1.5" style="fill:#29252c">YOUR BROWSER</text><text x="110.0" y="276" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="400" letter-spacing="0" style="fill:#5f5862">Encrypts every sample with</text><text x="110.0" y="297" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="400" letter-spacing="0" style="fill:#5f5862">a key only you can unlock.</text></g><path d="M210.0 710V764" style="fill:none;stroke:#29252c" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/><path d="M202.0 756L210.0 766L218.0 756" style="fill:none;stroke:#29252c" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/><text x="228.0" y="742.0" text-anchor="start" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="500" letter-spacing="1.2" style="fill:#5f5862">ENCRYPTED</text><g transform="translate(100.0 762)"><g transform="translate(6 6)" style="fill:url(#hs)"><rect x="20" y="22" width="180" height="152"/></g><rect x="20" y="22" width="180" height="40" rx="0" style="fill:#f2b58c;stroke:#29252c" stroke-width="2"/><rect x="34" y="33" width="104" height="18" rx="0" style="fill:url(#hso);stroke:#29252c" stroke-width="0"/><path d="M172 32C172.6 39 175 41.4 182 42C175 42.6 172.6 45 172 52C171.4 45 169 42.6 162 42C169 41.4 171.4 39 172 32Z" style="fill:#29252c"/><rect x="20" y="78" width="180" height="40" rx="0" style="fill:#f2b58c;stroke:#29252c" stroke-width="2"/><rect x="34" y="89" width="104" height="18" rx="0" style="fill:url(#hso);stroke:#29252c" stroke-width="0"/><path d="M172 88C172.6 95 175 97.4 182 98C175 98.6 172.6 101 172 108C171.4 101 169 98.6 162 98C169 97.4 171.4 95 172 88Z" style="fill:#29252c"/><rect x="20" y="134" width="180" height="40" rx="0" style="fill:#f2b58c;stroke:#29252c" stroke-width="2"/><rect x="34" y="145" width="104" height="18" rx="0" style="fill:url(#hso);stroke:#29252c" stroke-width="0"/><path d="M172 144C172.6 151 175 153.4 182 154C175 154.6 172.6 157 172 164C171.4 157 169 154.6 162 154C169 153.4 171.4 151 172 144Z" style="fill:#29252c"/><path d="M20 62H200M20 118H200" style="fill:none;stroke:#29252c" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/><text x="110.0" y="212" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="13" font-weight="500" letter-spacing="1.5" style="fill:#29252c">THE VAULT</text><text x="110.0" y="238" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="400" letter-spacing="0" style="fill:#5f5862">Lives in this browser.</text><text x="110.0" y="259" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="400" letter-spacing="0" style="fill:#5f5862">Works with no connection.</text></g><rect x="20" y="346" width="380" height="756" rx="12" style="fill:none;stroke:#5f5862" stroke-width="1.5" stroke-dasharray="5 5"/><text x="40" y="374" text-anchor="start" font-family="DM Mono, ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="1.5" style="fill:#5f5862">YOUR DEVICE · THIS BROWSER</text><text x="210.0" y="1080" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="1.2" style="fill:#8c3f00">PLAIN SAMPLES NEVER LEAVE</text><path d="M210.0 1118V1172" style="fill:none;stroke:#29252c" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" stroke-dasharray="6 5"/><path d="M202.0 1164L210.0 1174L218.0 1164" style="fill:none;stroke:#29252c" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/><text x="228.0" y="1150.0" text-anchor="start" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="500" letter-spacing="1.2" style="fill:#5f5862">OPTIONAL PAID BACKUP</text><g transform="translate(90.0 1184)"><g transform="translate(6 6)" style="fill:url(#hs)"><path d="M58 132H184A26 26 0 0 0 182 80A40 40 0 0 0 106 70A31 31 0 0 0 58 132Z"/></g><path d="M58 132H184A26 26 0 0 0 182 80A40 40 0 0 0 106 70A31 31 0 0 0 58 132Z" style="fill:#fffaf2;stroke:#29252c" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/><rect x="82" y="96" width="76" height="24" rx="0" style="fill:url(#hsc);stroke:#29252c" stroke-width="0"/><rect x="82" y="96" width="76" height="24" rx="0" style="fill:none;stroke:#29252c" stroke-width="2"/><path d="M200 44C200.36 48.2 201.8 49.64 206 50C201.8 50.36 200.36 51.8 200 56C199.64 51.8 198.2 50.36 194 50C198.2 49.64 199.64 48.2 200 44Z" style="fill:#8c3f00"/><text x="120.0" y="180" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="13" font-weight="500" letter-spacing="1.5" style="fill:#29252c">ENCRYPTED BACKUP</text><text x="120.0" y="206" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="400" letter-spacing="0" style="fill:#5f5862">Only ciphertext is uploaded.</text><text x="120.0" y="227" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="400" letter-spacing="0" style="fill:#5f5862">We can't open it.</text><path d="M24.0 261L29.0 266L38.0 256" style="fill:none;stroke:#8c3f00" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/><text x="46.0" y="266" text-anchor="start" font-family="DM Mono, ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="1.2" style="fill:#29252c">WE SEE</text><text x="46.0" y="286" text-anchor="start" font-family="DM Sans, system-ui, sans-serif" font-size="13.5" font-weight="400" letter-spacing="0" style="fill:#5f5862">Order email, vault ID,</text><text x="46.0" y="304" text-anchor="start" font-family="DM Sans, system-ui, sans-serif" font-size="13.5" font-weight="400" letter-spacing="0" style="fill:#5f5862">upload times and sizes</text><path d="M25.0 324L35.0 334M35.0 324L25.0 334" style="fill:none;stroke:#8c3f00" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/><text x="46.0" y="334" text-anchor="start" font-family="DM Mono, ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="1.2" style="fill:#29252c">WE CAN'T SEE</text><text x="46.0" y="354" text-anchor="start" font-family="DM Sans, system-ui, sans-serif" font-size="13.5" font-weight="400" letter-spacing="0" style="fill:#5f5862">Your key or your samples</text></g><rect x="20" y="1184" width="380" height="370" rx="12" style="fill:none;stroke:#5f5862" stroke-width="1.5" stroke-dasharray="5 5"/><text x="40" y="1212" text-anchor="start" font-family="DM Mono, ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="1.5" style="fill:#5f5862">OUR SERVER</text></svg>