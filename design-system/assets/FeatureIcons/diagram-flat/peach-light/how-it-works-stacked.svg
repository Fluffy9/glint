<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1574" viewBox="0 0 420 1574" role="img" aria-labelledby="t-420"><title id="t-420">How Glint works: the band sends samples over Bluetooth to your browser, which encrypts them into a vault in this browser. Optional paid backup uploads ciphertext only.</title><rect width="100%" height="100%" fill="#f8f0e3"/><defs><pattern id="hs" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" style="fill:#29252c"/><rect x="2" y="2" width="2" height="2" style="fill:#29252c"/></pattern></defs><defs><pattern id="hsc" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" style="fill:#8c3f00"/><rect x="2" y="2" width="2" height="2" style="fill:#8c3f00"/></pattern></defs><defs><pattern id="hso" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" style="fill:#29252c"/><rect x="2" y="2" width="2" height="2" style="fill:#29252c"/></pattern></defs><text x="210.0" y="30" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="1.5" style="fill:#5f5862">ON YOUR WRIST</text><g transform="translate(100.0 20)"><g transform="translate(6 6)" style="fill:url(#hs)"><rect x="72" y="40" width="76" height="94" rx="14"/></g><rect x="20" y="72" width="180" height="30" rx="0" style="fill:#fee2cf;stroke:#29252c" stroke-width="2"/><path d="M32 83C32.24 85.8 33.2 86.76 36 87C33.2 87.24 32.24 88.2 32 91C31.76 88.2 30.8 87.24 28 87C30.8 86.76 31.76 85.8 32 83Z" style="fill:#8c3f00"/><path d="M50 83C50.24 85.8 51.2 86.76 54 87C51.2 87.24 50.24 88.2 50 91C49.76 88.2 48.8 87.24 46 87C48.8 86.76 49.76 85.8 50 83Z" style="fill:#8c3f00"/><path d="M170 83C170.24 85.8 171.2 86.76 174 87C171.2 87.24 170.24 88.2 170 91C169.76 88.2 168.8 87.24 166 87C168.8 86.76 169.76 85.8 170 83Z" style="fill:#8c3f00"/><path d="M188 83C188.24 85.8 189.2 86.76 192 87C189.2 87.24 188.24 88.2 188 91C187.76 88.2 186.8 87.24 184 87C186.8 86.76 187.