<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="540" viewBox="0 0 1190 540" role="img" aria-labelledby="t-1190"><title id="t-1190">How Glint works: the band sends samples over Bluetooth to your browser, which encrypts them into a vault in this browser. Optional paid backup uploads ciphertext only.</title><rect width="100%" height="100%" fill="#f8f0e3"/><defs><pattern id="hw" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" style="fill:#29252c"/><rect x="2" y="2" width="2" height="2" style="fill:#29252c"/></pattern></defs><defs><pattern id="hwc" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" style="fill:#006095"/><rect x="2" y="2" width="2" height="2" style="fill:#006095"/></pattern></defs><defs><pattern id="hwo" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" style="fill:#29252c"/><rect x="2" y="2" width="2" height="2" style="fill:#29252c"/></pattern></defs><text x="120" y="48" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="1.5" style="fill:#5f5862">ON YOUR WRIST</text><g transform="translate(10 70)"><g transform="translate(6 6)" style="fill:url(#hw)"><rect x="72" y="40" width="76" height="94" rx="14"/></g><rect x="20" y="72" width="180" height="30" rx="0" style="fill:#cfedff;stroke:#29252c" stroke-width="2"/><path d="M32 83C32.24 85.8 33.2 86.76 36 87C33.2 87.24 32.24 88.2 32 91C31.76 88.2 30.8 87.24 28 87C30.8 86.76 31.76 85.8 32 83Z" style="fill:#006095"/><path d="M50 83C50.24 85.8 51.2 86.76 54 87C51.2 87.24 50.24 88.2 50 91C49.76 88.2 48.8 87.24 46 87C48.8 86.76 49.76 85.8 50 83Z" style="fill:#006095"/><path d="M170 83C170.24 85.8 171.2 86.76 174 87C171.2 87.24 170.24 88.2 170 91C169.76 88.2 168.8 87.24 166 87C168.8 86.76 169.76 85.8 170 83Z" style="fill:#006095"/><path d="M188 83C188.24 85.8 189.2 86.76 192 87C189.2 87.24 188.24 88.2 188 91C187.76 88.2 186.8 87.24 184 87C186.8 86.76 187.76 85.8 188 83Z" style="fill:#006095"/><rect x="72" y="40" width="76" height="94" rx="14" style="fill:#89cef6;stroke:#29252c" stroke-width="2"/><rect x="81" y="49" width="58" height="76" rx="8" style="fill:#fffaf2;stroke:#29252c" stroke-width="2"/><path d="M110 73C110.84 82.8 114.2 86.16 124 87C114.2 87.84 110.84 91.2 110 101C109.16 91.2 105.8 87.84 96 87C105.8 86.16 109.16 82.8 110 73Z" style="fill:#89cef6"/><path d="M110 73C110.84 82.8 114.2 86.16 124 87C114.2 87.84 110.84 91.2 110 101C109.16 91.2 105.8 87.84 96 87C105.8 86.16 109.16 82.8 110 73Z" style="fill:none;stroke:#29252c" stroke-width="2"/><text x="110.0" y="250" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="13" font-weight="500" letter-spacing="1.5" style="fill:#29252c">THE BAND</text><text x="110.0" y="276" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="400" letter-spacing="0" style="fill:#5f5862">Records heart rate, sleep</text><text x="110.0" y="297" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="400" letter-spacing="0" style="fill:#5f5862">and movement. No screen.</text></g><rect x="280" y="16" width="570" height="508" rx="12" style="fill:none;stroke:#5f5862" stroke-width="1.5" stroke-dasharray="5 5"/><text x="300" y="44" text-anchor="start" font-family="DM Mono, ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="1.5" style="fill:#5f5862">YOUR DEVICE · THIS BROWSER</text><text x="565.0" y="502" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="1.2" style="fill:#006095">PLAIN SAMPLES NEVER LEAVE THIS BOX</text><g transform="translate(300 70)"><g transform="translate(6 6)" style="fill:url(#hw)"><rect x="10" y="20" width="200" height="140"/></g><rect x="10" y="20" width="200" height="140" rx="0" style="fill:#fffaf2;stroke:#29252c" stroke-width="2"/><rect x="10" y="20" width="200" height="26" rx="0" style="fill:#cfedff;stroke:#29252c" stroke-width="2"/><text x="22" y="37" text-anchor="start" font-family="DM Mono, monospace" font-size="9" font-weight="500" style="fill:#29252c">DASHBOARD</text><circle cx="184" cy="33" r="4" style="fill:none;stroke:#29252c" stroke-width="2"/><circle cx="170" cy="33" r="4" style="fill:none;stroke:#29252c" stroke-width="2"/><path d="M24 104H44L50 86L60 124L66 96H92" style="fill:none;stroke:#29252c" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/><path d="M102 104H128" style="fill:none;stroke:#29252c" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/><path d="M121 97L128 104L121 111" style="fill:none;stroke:#29252c" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/><path d="M150 98V88A12 12 0 0 1 174 88V98" style="fill:none;stroke:#29252c" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/><rect x="142" y="98" width="40" height="36" rx="0" style="fill:#89cef6;stroke:#29252c" stroke-width="2"/><path d="M162 107C162.54 113.3 164.7 115.46 171 116C164.7 116.54 162.54 118.7 162 125C161.46 118.7 159.3 116.54 153 116C159.3 115.46 161.46 113.3 162 107Z" style="fill:#29252c"/><path d="M110 160V180" style="fill:none;stroke:#5f5862" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" stroke-dasharray="2 3"/><rect x="22" y="180" width="176" height="30" rx="15" style="fill:#cfedff;stroke:#29252c" stroke-width="2"/><circle cx="44" cy="195" r="5.5" style="fill:none;stroke:#29252c" stroke-width="2"/><path d="M50 195H62M58 195V200" style="fill:none;stroke:#29252c" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/><text x="126" y="198.5" text-anchor="middle" font-family="DM Mono, monospace" font-size="8.5" font-weight="500" style="fill:#29252c">PASSKEY / RECOVERY KEY</text><text x="110.0" y="250" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="13" font-weight="500" letter-spacing="1.5" style="fill:#29252c">YOUR BROWSER</text><text x="110.0" y="276" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="400" letter-spacing="0" style="fill:#5f5862">Encrypts every sample with</text><text x="110.0" y="297" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="400" letter-spacing="0" style="fill:#5f5862">a key only you can unlock.</text></g><g transform="translate(610 70)"><g transform="translate(6 6)" style="fill:url(#hw)"><rect x="20" y="22" width="180" height="152"/></g><rect x="20" y="22" width="180" height="40" rx="0" style="fill:#89cef6;stroke:#29252c" stroke-width="2"/><rect x="34" y="33" width="104" height="18" rx="0" style="fill:url(#hwo);stroke:#29252c" stroke-width="0"/><path d="M172 32C172.6 39 175 41.4 182 42C175 42.6 172.6 45 172 52C171.4 45 169 42.6 162 42C169 41.4 171.4 39 172 32Z" style="fill:#29252c"/><rect x="20" y="78" width="180" height="40" rx="0" style="fill:#89cef6;stroke:#29252c" stroke-width="2"/><rect x="34" y="89" width="104" height="18" rx="0" style="fill:url(#hwo);stroke:#29252c" stroke-width="0"/><path d="M172 88C172.6 95 175 97.4 182 98C175 98.6 172.6 101 172 108C171.4 101 169 98.6 162 98C169 97.4 171.4 95 172 88Z" style="fill:#29252c"/><rect x="20" y="134" width="180" height="40" rx="0" style="fill:#89cef6;stroke:#29252c" stroke-width="2"/><rect x="34" y="145" width="104" height="18" rx="0" style="fill:url(#hwo);stroke:#29252c" stroke-width="0"/><path d="M172 144C172.6 151 175 153.4 182 154C175 154.6 172.6 157 172 164C171.4 157 169 154.6 162 154C169 153.4 171.4 151 172 144Z" style="fill:#29252c"/><path d="M20 62H200M20 118H200" style="fill:none;stroke:#29252c" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/><text x="110.0" y="250" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="13" font-weight="500" letter-spacing="1.5" style="fill:#29252c">THE VAULT</text><text x="110.0" y="276" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="400" letter-spacing="0" style="fill:#5f5862">Lives in this browser.</text><text x="110.0" y="297" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="400" letter-spacing="0" style="fill:#5f5862">Works with no connection.</text></g><path d="M214 170H304" style="fill:none;stroke:#29252c" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/><path d="M296 162L306 170L296 178" style="fill:none;stroke:#29252c" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/><rect x="221.7" y="145" width="76.60000000000001" height="15" style="fill:#f8f0e3"/><text x="260.0" y="156" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="500" letter-spacing="1.2" style="fill:#5f5862">BLUETOOTH</text><path d="M532 170H614" style="fill:none;stroke:#29252c" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/><path d="M606 162L616 170L606 178" style="fill:none;stroke:#29252c" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/><rect x="535.7" y="145" width="76.60000000000001" height="15" style="fill:#f8f0e3"/><text x="574.0" y="156" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="500" letter-spacing="1.2" style="fill:#5f5862">ENCRYPTED</text><rect x="890" y="16" width="280" height="508" rx="12" style="fill:none;stroke:#5f5862" stroke-width="1.5" stroke-dasharray="5 5"/><text x="910" y="44" text-anchor="start" font-family="DM Mono, ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="1.5" style="fill:#5f5862">OUR SERVER</text><g transform="translate(910 70)"><g transform="translate(6 6)" style="fill:url(#hw)"><path d="M58 132H184A26 26 0 0 0 182 80A40 40 0 0 0 106 70A31 31 0 0 0 58 132Z"/></g><path d="M58 132H184A26 26 0 0 0 182 80A40 40 0 0 0 106 70A31 31 0 0 0 58 132Z" style="fill:#fffaf2;stroke:#29252c" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/><rect x="82" y="96" width="76" height="24" rx="0" style="fill:url(#hwc);stroke:#29252c" stroke-width="0"/><rect x="82" y="96" width="76" height="24" rx="0" style="fill:none;stroke:#29252c" stroke-width="2"/><path d="M200 44C200.36 48.2 201.8 49.64 206 50C201.8 50.36 200.36 51.8 200 56C199.64 51.8 198.2 50.36 194 50C198.2 49.64 199.64 48.2 200 44Z" style="fill:#006095"/><text x="120.0" y="250" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="13" font-weight="500" letter-spacing="1.5" style="fill:#29252c">ENCRYPTED BACKUP</text><text x="120.0" y="276" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="400" letter-spacing="0" style="fill:#5f5862">Only ciphertext is uploaded.</text><text x="120.0" y="297" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="400" letter-spacing="0" style="fill:#5f5862">We can't open it.</text></g><g transform="translate(910 70)"><path d="M24.0 347L29.0 352L38.0 342" style="fill:none;stroke:#006095" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/><text x="46.0" y="352" text-anchor="start" font-family="DM Mono, ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="1.2" style="fill:#29252c">WE SEE</text><text x="46.0" y="372" text-anchor="start" font-family="DM Sans, system-ui, sans-serif" font-size="13.5" font-weight="400" letter-spacing="0" style="fill:#5f5862">Order email, vault ID,</text><text x="46.0" y="390" text-anchor="start" font-family="DM Sans, system-ui, sans-serif" font-size="13.5" font-weight="400" letter-spacing="0" style="fill:#5f5862">upload times and sizes</text><path d="M25.0 410L35.0 420M35.0 410L25.0 420" style="fill:none;stroke:#006095" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/><text x="46.0" y="420" text-anchor="start" font-family="DM Mono, ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="1.2" style="fill:#29252c">WE CAN'T SEE</text><text x="46.0" y="440" text-anchor="start" font-family="DM Sans, system-ui, sans-serif" font-size="13.5" font-weight="400" letter-spacing="0" style="fill:#5f5862">Your key or your samples</text></g><path d="M822 170H960" style="fill:none;stroke:#29252c" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" stroke-dasharray="6 5"/><path d="M952 162L962 170L952 178" style="fill:none;stroke:#29252c" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/><rect x="857.4" y="145" width="69.2" height="15" style="fill:#f8f0e3"/><text x="892.0" y="156" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="500" letter-spacing="1.2" style="fill:#5f5862">OPTIONAL</text><rect x="846.3" y="185" width="91.4" height="15" style="fill:#f8f0e3"/><text x="892.0" y="196" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="500" letter-spacing="1.2" style="fill:#5f5862">PAID BACKUP</text></svg>