<!-- @dsCard group="Brand" height=96 subtitle="24px grid, 2px square-capped strokes" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Preview</title></head>
<body>
<div id="root" class="gl-row" style="gap:20px"></div>
<script>
var G = window.Glint, h = React.createElement;
var names = ['search','close','check','heart','user','sync','moon','bolt','info','warning'];
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment,null, names.map(function(n){
  return h('div',{key:n,style:{display:'flex',flexDirection:'column',alignItems:'center',gap:'6px'}}, h(G.Icon,{name:n,size:24}), h('span',{className:'caption',style:{color:'var(--ink-muted)'}},n));
})));
</script>
</body>
</html>
