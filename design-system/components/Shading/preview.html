<!-- @dsCard group="Foundations" height=420 page subtitle="Checker dither at 25, 50 and 75%" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shading</title>
<style>
  .wrap { padding: 16px 24px 32px 16px; display: flex; flex-direction: column; gap: 28px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .sw i { display: block; width: 112px; height: 64px; border: 2px solid var(--line); border-radius: 4px; background-color: var(--surface); }
  .sw b { font-family: var(--font-mono); font-size: 12px; line-height: 16px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }
  .sw code { font-family: var(--font-mono); font-size: 11px; line-height: 14px; color: var(--ink-muted); }
  .stack { position: relative; width: 300px; height: 190px; }
  .stack .gl-win { position: absolute; width: 200px; }
  .ex { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
</style>
</head>
<body>
<div id="root"></div>
<script>
var G = window.Glint, h = React.createElement;
function Sw(cls, label, code, style) { return h('div', { className: 'sw' }, h('i', { className: cls, style: style }), h('b', null, label), h('code', null, code)); }
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'wrap' },
  h('div', { className: 'row' },
    Sw('gl-shade-25', 'Shade 25', '.gl-shade-25'),
    Sw('gl-shade-50', 'Shade 50', '.gl-shade-50'),
    Sw('gl-shade-75', 'Shade 75', '.gl-shade-75'),
    Sw('gl-shade-50', 'Accent 50', '--gl-shade: accent', { '--gl-shade': 'var(--accent)' }),
    Sw('gl-shade-50', 'Subtle 50', '--gl-shade: line-subtle', { '--gl-shade': 'var(--line-subtle)' })),
  h('div', { className: 'row', style: { gap: '48px', alignItems: 'flex-start' } },
    h('div', { className: 'stack' },
      h(G.Card, { title: 'Level 1', style: { left: 0, top: 0 } }, h('span', { className: 'caption' }, 'elev-2 offset')),
      h(G.Card, { title: 'Level 2', style: { left: 50, top: 46 } }, h('span', { className: 'caption' }, 'elev-2 offset')),
      h(G.Card, { title: 'Level 3', elevation: 3, accent: true, style: { left: 100, top: 92 } }, h('span', { className: 'caption' }, 'elev-3 offset'))),
    h('div', { className: 'ex' },
      h(G.Button, { variant: 'ghost', state: 'hover' }, 'Ghost hover'),
      h(G.Tabs, { items: [{ id: 'a', label: 'Day' }, { id: 'b', label: 'Week' }], defaultValue: 'a' }),
      h(G.Button, { variant: 'primary', disabled: true, brackets: true }, 'Disabled'),
      h(G.Toggle, { label: 'Off track' })),
    h(G.ProgressRing, { value: 0.4, size: 120, thickness: 14, label: 'Track' }))
));
</script>
</body>
</html>
