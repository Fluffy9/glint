<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="../vendor/react.production.min.js"></script><script src="../vendor/react-dom.production.min.js"></script><script src="../components/bundle.js"></script><script>try{var t=new URLSearchParams(location.search).get("theme")||localStorage.getItem("glintTheme")||"lavender-light";document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","lavender-light")}</script><meta charset="utf-8"><title>Motion</title>
<style>
  .wrap { padding: 16px 24px 32px 16px; display: flex; flex-direction: column; gap: 32px; }

  .bar span:last-child { color: var(--ink-muted); text-align: right; }

  .box { position: relative; width: 160px; height: 132px; display: grid; place-items: center; border: 1px dashed var(--line-subtle); border-radius: 4px; }
  .box .gl-win { width: 132px; }
  .note { font-size: 14px; line-height: 20px; color: var(--ink-muted); max-width: 160px; }
</style></head>
<body>
<div id="root"></div>
<script>
