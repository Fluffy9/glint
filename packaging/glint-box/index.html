<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1360"><title>Glint slide box</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Pixelify+Sans:wght@400..700&amp;display=swap">
<style>
body{margin:0}
.pat{fill:var(--deep)}
.spk{fill:var(--deep)}
.ink{fill:#29252c}
.face{position:absolute;box-sizing:border-box;overflow:hidden;background:var(--accent)}
.face svg{position:absolute;left:0;top:0;display:block}
@keyframes glSway{0%{transform:rotateY(-6deg)}50%{transform:rotateY(6deg)}100%{transform:rotateY(-6deg)}}
@keyframes glFloat{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-14px) rotate(8deg)}100%{transform:translateY(0) rotate(0deg)}}
.sway{animation:glSway 9s ease-in-out infinite;transform-style:preserve-3d}
.float1{animation:glFloat 6s ease-in-out infinite}
.float2{animation:glFloat 7.5s ease-in-out infinite 1.2s}
.float3{animation:glFloat 5.5s ease-in-out infinite 0.6s}
.chip{cursor:pointer}
.chip:focus-visible{outline:3px solid #29252c;outline-offset:2px}
.stage{cursor:grab;touch-action:none}
.stage:active{cursor:grabbing}
.p3{transform-style:preserve-3d}
</style>

<style>html,body{margin:0;background:#f1ecf8}#wrap{transform-origin:0 0}</style></head><body><div id="wrap"></div>
<script>
var DCLogic=function(p){this.props=p;this.state={};};DCLogic.prototype.setState=function(s){Object.assign(this.state,s);window.__render()};

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { rx: -24, ry: -36, hue: null, pat: 'warpCheck', size: null, view: 'single', slide: 1 }; this._cache = {}; }
  lib() {
    if (this._lib) return this._lib;
    var SP = [[50,0],[53,35],[65,47],[100,50],[65,53],[53,65],[50,100],[47,65],[35,53],[0,50],[35,47],[47,35],[50,0]];
    function f(n) { return String(Math.round(n * 10) / 10); }
    function pts(cx, cy, r) { var k = r / 50; return SP.map(function (a) { return f(cx + (a[0] - 50) * k) + ' ' + f(cy + (a[1] - 50) * k); }); }
    function path(q) { return 'M' + q[0] + 'C' + q[1] + ' ' + q[2] + ' ' + q[3] + 'C' + q[4] + ' ' + q[5] + ' ' + q[6] + 'C' + q[7] + ' ' + q[8] + ' ' + q[9] + 'C' + q[10] + ' ' + q[11] + ' ' + q[12] + 'Z'; }
    function sp(cx, cy, r) { return path(pts(cx, cy, r)); }
    function spR(cx, cy, r) { return path(pts(cx, cy, r).reverse()); }
    function sq(x, y, w, h) { return 'M' + f(x) + ' ' + f(y) + 'h' + f(w) + 'v' + f(h === undefined ? w : h) + 'h' + f(-w) + 'Z'; }
    function circ(cx, cy, r) { return 'M' + f(cx - r) + ' ' + f(cy) + 'a' + f(r) + ' ' + f(r) + ' 0 1 0 ' + f(2 * r) + ' 0a' + f(r) + ' ' + f(r) + ' 0 1 0 ' + f(-2 * r) + ' 0Z'; }

    function warp(W, H, u, o) {

      var rot = (o.rot || 0) * Math.PI / 180, cr = Math.cos(rot), sr = Math.sin(rot), mx = W / 2, my = H / 2;

      var i0 = -1, i1 = Math.ceil(W / c), j0 = -1, j1 = Math.ceil(H / c), R;

        if (((i + j) % 2 + 2) % 2) continue;
        var x0 = i * c, y0 = j * c, q = [], t;
        for (t = 0; t < N; t++) q.push(Q(x0 + c * t / N, y0));
        for (t = 0; t < N; t++) q.push(Q(x0 + c, y0 + c * t / N));
        for (t = 0; t < N; t++) q.push(Q(x0 + c - c * t / N, y0 + c));
        for (t = 0; t < N; t++) q.push(Q(x0, y0 + c - c * t / N));
        d += 'M' + q.join('L') + 'Z';
        if (o.spark && ((((i * 73 + j * 151) % 9) + 9) % 9) === 0) { var p = Qp(x0 + c / 2, y0 + c / 2); d += spR(p[0], p[1], c * 0.34); }
      }
      return d;
    }
    var P = {
      plain: function () { return ''; },
      warpCheck: function (W, H, u) { return warp(W, H, u, { c: 25 }); },
      warpFine: function (W, H, u) { return warp(W, H, u, { c: 13, N: 5 }); },
      warpDiag: function (W, H, u) { return warp(W, H, u, { c: 24, rot: 45, N: 6 }); },
      warpSpark: function (W, H, u) { return warp(W, H, u, { c: 30, spark: true }); },
      sparklePlus: function (W, H, u) {

      },
      houndstooth: function (W, H, u) {

      },

      },
      starLattice: function (W, H, u) {

      bubbles: function (W, H, u) {

      },
      pixelField: function (W, H, u) {

        for (var j = 0; j < n; j++) for (var i = 0; i < n; i++) {
          var a = Math.abs((i + 0.5) / n - 0.5) * 2, b = Math.abs((j + 0.5) / n - 0.5) * 2;

          }
        }

      }
    };

    return this._lib;
  }
  pat(name, W, H, u) {
    var key = name + ':' + W + ':' + H + ':' + u;

    return this._cache[key];
  }
  renderVals() {
    var self = this, L = this.lib(), sp = L.sp, circ = L.circ;
    var hue = this.state.hue ?? this.props.hue ?? 300;
    var SIZES = [['Band box · 110×110×60', [110, 110, 60]], ['Gift · 160×160×90', [160, 160, 90]], ['Bundle · 220×140×80', [220, 140, 80]], ['Cube · 120', [120, 120, 120]]];
    var mm = this.state.size || [this.props.width ?? 110, this.props.depth ?? 110, this.props.height ?? 60];
    var outlined = (this.props.look ?? 'soft') === 'outlined';
    var WAYS = [['Lavender', 300], ['Mint', 160], ['Peach', 55], ['Sky', 235], ['Butter', 95]];
    var wayName = 'Custom';
    WAYS.forEach(function (w) { if (w[1] === hue) wayName = w[0]; });
    var PATS = [['plain', 'Plain'], ['warpCheck', 'Wavy check · large'], ['warpFine', 'Wavy check · fine'], ['warpDiag', 'Wavy check · diagonal'], ['warpSpark', 'Wavy check · sparkle cut'], ['starLattice', 'Star lattice'], ['pixelField', 'Pixel field'], ['sparklePlus', 'Sparkle & plus'], ['houndstooth', 'Houndstooth'], ['bubbles', 'Bubbles'], ['wiggle', 'Wiggle']];
    var COMPARE = [['warpCheck', 'Wavy check · large'], ['warpFine', 'Wavy check · fine'], ['warpDiag', 'Wavy check · diagonal'], ['warpSpark', 'Wavy check · sparkle cut']];

    var ink = '#29252c';
    function box(patName, label, idx) {
      var s = compare ? 1.35 : 3.0;
      var W = Math.round(mm[0] * s), D = Math.round(mm[1] * s), H = Math.round(mm[2] * s);
      var t = Math.max(3, Math.round(s * 1.4)), Wt = W - 6, Dt = D - 2 * t, Ht = H - 2 * t;
      var sl = Math.round(frac * W * 0.7), u = s * 0.4, uc = s * 0.25, minSide = Math.min(W, D);
      var wordFs = Math.max(12, Math.round(minSide * 0.17)), capFs = Math.max(7, Math.round(minSide * 0.045));
      var visW = sl - 3, R = Math.min(Dt * 0.4, visW * 0.46), showCoil = R >= 14, r = R * 0.62, Ri = Math.max(1, Math.round(R));
      var coilD = showCoil ? 2 * Ri : 2;
      var cx = compare ? 206 + 316 * idx : 680, cy = compare ? 290 : 330;
      var shW = Math.round((W + D) * 0.95 + sl * 0.5), shH = Math.round(50 + D * 0.35);
      return {
        cx: cx, cy: cy, label: label, labelDisplay: compare ? 'block' : 'none', labelTop: Math.round(H * 0.55 + D * 0.3 + 40),
        shW: shW, shH: shH, shL: -Math.round(shW / 2), shT: Math.round(H * 0.55 - 12),
        W: W, D: D, H: H, W2: W / 2, D2: D / 2, H2: H / 2, nW2: -W / 2, nD2: -D / 2, nH2: -H / 2,
        Wt: Wt, Dt: Dt, Ht: Ht, Wt2: Wt / 2, Dt2: Dt / 2, Ht2: Ht / 2, nWt2: -Wt / 2, nDt2: -Dt / 2, nHt2: -Ht / 2,
        sl: sl, shift: -Math.round(sl / 2), frame: Math.max(3, Math.round(s * 2.2)),
        patF: self.pat(patName, W, H, u),
        stripL: Math.round(Wt - visW), stripL2: Math.round(Wt - visW) + 6, stripDisplay: sl > 3 ? 'block' : 'none',
        coilD: coilD, coilL: showCoil ? Math.round(Wt - visW / 2 - R) : 0, coilT: Math.round(Dt / 2 - R), coilDisplay: showCoil ? 'block' : 'none',
        clipId: 'coil' + idx, clipRef: 'url(#coil' + idx + ')',
        annulus: showCoil ? circ(Ri, Ri, Ri) + circ(Ri, Ri, r) : 'M0 0',
        patCoil: showCoil ? self.pat('starLattice', coilD, coilD, uc) : '',
        coilStroke: outlined ? ink : 'rgba(41,37,44,0.22)',
        endMark: Math.round(Math.min(Dt, Ht) * 0.4),
        wordFs: wordFs, capFs: capFs, markPx: Math.round(wordFs * 1.1), gap: Math.round(wordFs * 0.4), ts: Math.max(2, Math.round(wordFs * 0.07)),
        sparkBox: 10, spA: Math.round(wordFs * 0.8), spB: Math.round(wordFs * 0.5),
        stPadX: Math.round(capFs * 1.0), stPadY: Math.round(capFs * 0.6), stShadow: outlined ? '2px 2px 0 0 ' + ink : '0 2px 6px rgba(41,37,44,0.18)'
      };
    }
    var boxes = compare ? COMPARE.map(function (p, i) { return box(p[0], p[1], i); }) : [box(this.state.pat, '', 0)];
    var b0 = boxes[0], wd = b0.W + b0.D;
    return {
      c: { accent: 'oklch(0.82 0.09 ' + hue + ')', deep: 'oklch(0.7 0.1 ' + hue + ')', hl: 'oklch(0.91 0.05 ' + hue + ')', strong: 'oklch(0.55 0.13 ' + hue + ')', deepink: 'oklch(0.36 0.1 ' + hue + ')', bgHi: 'oklch(0.97 0.018 ' + hue + ')', bgLo: 'oklch(0.89 0.045 ' + hue + ')' },
      wayName: wayName, dims: mm[0] + ' × ' + mm[1] + ' × ' + mm[2] + ' mm',
      rx: this.state.rx, ry: this.state.ry,
      edge: outlined ? '2px solid ' + ink : '0', labelEdge: outlined ? '2px solid ' + ink : '0',
      mark: sp(50, 50, 50), boxes: boxes,

      s1x: Math.round(680 - wd * 0.62 - 30 - b0.sl * 0.3), s2x: Math.round(680 + wd * 0.55 + b0.sl * 0.4), s3x: Math.round(680 + wd * 0.62 + 10 + b0.sl * 0.4),
      down: function (e) { self.drag = { x: e.clientX, y: e.clientY, rx: self.state.rx, ry: self.state.ry }; if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId); },
      move: function (e) { var g = self.drag; if (!g) return; self.setState({ ry: g.ry + (e.clientX - g.x) * 0.4, rx: Math.max(-70, Math.min(10, g.rx - (e.clientY - g.y) * 0.3)) }); },
      up: function () { self.drag = null; },

      slides: [[0, 'Closed'], [0.5, 'Half'], [1, 'Open']].map(function (z) { var on = z[0] === frac; return { name: z[1], selected: on, bg: on ? 'oklch(0.82 0.09 ' + hue + ')' : '#fffaf2', pick: function () { self.setState({ slide: z[0] }); } }; }),
      sizes: SIZES.map(function (z) { var on = z[1][0] === mm[0] && z[1][1] === mm[1] && z[1][2] === mm[2]; return { name: z[0], selected: on, bg: on ? 'oklch(0.82 0.09 ' + hue + ')' : '#fffaf2', pick: function () { self.setState({ size: z[1] }); } }; }),
      pats: PATS.map(function (z) { var on = !compare && z[0] === self.state.pat; return { name: z[1], selected: on, bg: on ? 'oklch(0.82 0.09 ' + hue + ')' : '#fffaf2', pick: function () { self.setState({ pat: z[0], view: 'single' }); } }; }),
      ways: WAYS.map(function (z) { var on = z[1] === hue; return { name: z[0], dot: 'oklch(0.82 0.09 ' + z[1] + ')', selected: on, bg: on ? 'oklch(0.82 0.09 ' + z[1] + ')' : '#fffaf2', pick: function () { self.setState({ hue: z[1] }); } }; })
    };
  }
}
